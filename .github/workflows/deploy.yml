name: Deploy wisamdamouny to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy static site over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key"
          # ship index.html into the root, plus assets/ and blog/ (each into its OWN subdir, keeps structure),
          # and the root-level robots.txt + sitemap.xml.
          ssh $SSH_OPTS root@"$HOST" "mkdir -p /opt/wisamdamouny/assets /opt/wisamdamouny/blog"
          rsync -az -e "ssh $SSH_OPTS" index.html root@"$HOST":/opt/wisamdamouny/
          rsync -az -e "ssh $SSH_OPTS" robots.txt sitemap.xml root@"$HOST":/opt/wisamdamouny/
          rsync -az --delete -e "ssh $SSH_OPTS" assets/ root@"$HOST":/opt/wisamdamouny/assets/
          rsync -az --delete -e "ssh $SSH_OPTS" blog/ root@"$HOST":/opt/wisamdamouny/blog/
          echo "=== live check ==="
          ssh $SSH_OPTS root@"$HOST" "ls /opt/wisamdamouny/ && echo 'assets...' && ls /opt/wisamdamouny/assets/ && echo 'blog...' && ls /opt/wisamdamouny/blog/ && echo DEPLOYED"